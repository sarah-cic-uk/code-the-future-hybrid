<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="keywords" content="Code, Future, HTML, CSS, JavaScript, IBM, CIC" />
  <meta name="description" content="Code the Future free HTML/CSS coding bootcamp" />
  <meta name="author" content="Sarah Neenan" />

  <title>Code the Future</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" />

  <script type="text/javascript" src="./js/app.js"></script>
  <script src="./js/cohort-management.js"></script>
  <script src="./js/s3-profile-pictures.js"></script>
  
  <style>
    .pagination-container .btn {
      margin: 0.2rem;
      border-color: transparent;
    }

    .pagination-container .btn.active {
      background-color: #d9437a;
      color: white;
    }

    .pagination-container .btn.active:hover {
      background-color: #d9437a;
      color: white;
      cursor: none;
      pointer-events: none;
    }

    .pagination-container .btn-outline-secondary:hover {
      background-color: #31238c;
      color: white;
    }

    .dynamic-link {
      cursor: pointer;
    }

    .card-body img {
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 150px;
    }

    /* Tutor-only cohort switcher */
    .cohort-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      max-width: 1100px;
      margin: 0.5rem auto 1.5rem;
    }

    .cohort-chip {
      border: 2px solid #31238c;
      border-radius: 999px;
      background-color: white;
      color: #31238c;
      padding: 0.3rem 0.9rem;
    }

    .cohort-chip:hover {
      background-color: #31238c;
      color: white;
    }

    .cohort-chip.active {
      background-color: #d9437a;
      border-color: #d9437a;
      color: white;
    }

    .cohort-chip .chip-count {
      margin-left: 0.4rem;
      font-size: 0.85em;
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <div class="page-body">
    <nav class="navbar navbar-expand-lg bg-light">
      <div class="container-fluid g-0">
        <a onclick="createPath('index.html')" class="navbar-brand" href="#" style="
              border-right: 2px solid #d9437a;
              padding-right: 10px;
              color: #1d0c59;
            ">
          <img src="../images/logo.png" height="60px" alt="CTF logo" />
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
          aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-between" id="navbarNavAltMarkup">
          <div class="navbar-nav nav-justified">
            <a class="nav-link" href="#" onclick="createPath('index.html')">About CTF</a>
            <a class="nav-link" href="#" onclick="createPath('pages/meetTheTutors.html')">Meet the tutors</a>
            <a class="nav-link" href="#" onclick="createPath('pages/1on1.html')">Schedule a 1:1</a>
            <a class="nav-link" href="#" id="jobs-nav-link" onclick="createPath('pages/jobs.html')">Jobs at IBM</a>
            <a class="nav-link" href="#" onclick="createPath('pages/courseCatalog.html')">Course Catalog</a>
            <a class="nav-link" href="#" onclick="createPath('pages/sessions.html')" id="sessionsLink">Sessions</a>
          </div>
          <div class="d-flex align-items-center" div id="profile-button">
            <!-- Logged in Avatar -->
            <div>
              <p class=" my-auto" id="profileName">
              </p>
            </div>
            <div class="profileBtn dropdown px-3">
              <a class="btn dropdown-toggle" href="#" role="button" id="dropdownMenuLink" data-bs-toggle="dropdown"
                aria-expanded="false">
                <img id="profile-pic-avatar" class="rounded-circle" height="25" alt=""
                  src="../images/blank_avatar.jpg"
                  loading="lazy" />
              </a>

              <ul class="dropdown-menu dropdown-menu-end" aria-labelledby=" dropdownMenuLink">
                <li>
                  <a class="dropdown-item" href="#" onclick="createPath('pages/profile.html')">My Profile</a>
                </li>
                <li>
                  <a class="dropdown-item" href="#" onclick="createPath('pages/cohort.html')">My Cohort</a>
                </li>
                <li id="teacher-menu-item" style="display: none;"><a class="dropdown-item" href="#"
                    onclick="createPath('pages/teacherCohortView.html')">View All Cohorts</a></li>
                <li id="tutor-menu-item" style="display: none;"><a class="dropdown-item" href="#"
                    onclick="createPath('pages/tutorAvailability.html')">Tutor Availability</a></li>
                <li id="admin-menu-item" style="display: none;"><a class="dropdown-item" href="#"
                    onclick="createPath('pages/adminCohortView.html')">All Cohorts (Admin)</a></li>
                <li>
                  <a class="dropdown-item" href="#" onclick="logUserOut()">Log out</a>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </nav>
    <div class="container-fluid page-content">
      <h1 class="text-center pt-4" id="cohort-heading">Meet your Cohort</h1>
      <!-- Tutor-only: one chip per cohort -->
      <div id="cohort-chips" class="cohort-chips" role="group" aria-label="Choose a cohort" style="display: none;"></div>
      <div class="row card-container">
        <!-- cohort cards here -->
      </div>
    </div>
  </div>

  <script type="text/javascript">

    const itemsPerPage = 8;
    let currentPage = 1;
    let cohortMembers = [];

    // Tutor mode: browse every cohort via the chip switcher
    const SELECTED_COHORT_KEY = 'myCohortSelected';
    let viewingAsTutor = false;
    let tutorCohorts = [];      // [{ code, name, taught }]
    let studentsByCohort = {};  // cohortCode -> User records
    let selectedCohortCode = null;

    window.onload = async (event) => {
      auth(
        null,
        document.querySelector(".profileBtn"),
        document.querySelector("#sessionsLink")
      );

      // Load cohort data using localStorage
      if (localStorage.getItem('loggedIn') === 'true') {
        // Refresh cached role/cohort flags from the DB first, so a recently
        // promoted teacher sees their cohort without needing to re-login.
        if (window.refreshUserRoleState) await window.refreshUserRoleState();

        const isTutor = localStorage.getItem('isTutor') === 'true' ||
          localStorage.getItem('isAdmin') === 'true';
        const isTeacher = localStorage.getItem('isTeacher') === 'true';
        const schoolPrefix = (localStorage.getItem('schoolPrefix') || '').trim();
        const cohortCode = localStorage.getItem('cohort');

        // Tutors can switch between every cohort; teachers see every student
        // across their school's cohorts (by prefix); everyone else sees their own cohort.
        if (isTutor) {
          await loadTutorCohorts();
        } else {
          let students = [];
          if (isTeacher && schoolPrefix) {
            students = await window.getStudentsBySchoolPrefix(schoolPrefix);
          } else if (cohortCode) {
            students = await window.getStudentsByCohort(cohortCode);
          }

          await loadCohortData(students);
        }

        const elements = document.getElementsByClassName("dynamic-link");
        for (let i = 0; i < elements.length; i++) {
          elements[i].addEventListener('click', (e) => redirect(e.target.name, e.target.id), false);
        }
      }
    };

    // Tutors browse every cohort. One scan of all users, grouped by cohort, so
    // switching chips is instant. Cohorts the tutor teaches are listed first.
    async function loadTutorCohorts() {
      viewingAsTutor = true;
      document.getElementById('cohort-heading').textContent = 'Cohort Profiles';
      showLoadingState();

      const userId = localStorage.getItem('userId');
      const [cohorts, students, me] = await Promise.all([
        window.getAllCohorts(),
        window.getAllStudents(),
        userId ? window.getUserById(userId) : null
      ]);

      studentsByCohort = {};
      students.forEach(s => {
        (studentsByCohort[s.cohortId] = studentsByCohort[s.cohortId] || []).push(s);
      });

      const taught = window.parseTeacherCohorts(me?.teacherCohorts);
      tutorCohorts = cohorts
        .map(c => ({ code: c.cohortCode, name: c.name || c.cohortCode, taught: taught.includes(c.cohortCode) }))
        .sort((a, b) => (b.taught - a.taught) || a.name.localeCompare(b.name));

      if (tutorCohorts.length === 0) {
        document.querySelector(".card-container").innerHTML = `
          <div class="col-12 text-center py-5">
            <h3 class="text-muted">No cohorts found</h3>
          </div>
        `;
        return;
      }

      // Reopen the last cohort viewed (e.g. coming back from a profile), else
      // the first cohort they teach, else their own cohort, else the first one.
      let saved = null;
      try { saved = sessionStorage.getItem(SELECTED_COHORT_KEY); } catch (e) { /* ignore storage errors */ }
      const initial = [saved, tutorCohorts.find(c => c.taught)?.code, localStorage.getItem('cohort')]
        .find(code => code && tutorCohorts.some(c => c.code === code)) || tutorCohorts[0].code;

      renderCohortChips();
      selectTutorCohort(initial);
    }

    function renderCohortChips() {
      const container = document.getElementById('cohort-chips');
      container.innerHTML = '';

      tutorCohorts.forEach(({ code, name, taught }) => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'cohort-chip';
        chip.dataset.code = code;
        if (taught) {
          chip.title = 'You teach this cohort';
          chip.insertAdjacentHTML('beforeend', '<i class="bi bi-person-check me-1"></i>');
        }
        chip.append(name);

        const count = document.createElement('span');
        count.className = 'chip-count';
        count.textContent = (studentsByCohort[code] || []).length;
        chip.appendChild(count);

        chip.addEventListener('click', () => selectTutorCohort(code));
        container.appendChild(chip);
      });

      container.style.display = 'flex';
    }

    function selectTutorCohort(code) {
      selectedCohortCode = code;
      try { sessionStorage.setItem(SELECTED_COHORT_KEY, code); } catch (e) { /* ignore storage errors */ }

      document.querySelectorAll('#cohort-chips .cohort-chip').forEach(chip => {
        const active = chip.dataset.code === code;
        chip.classList.toggle('active', active);
        chip.setAttribute('aria-pressed', active ? 'true' : 'false');
      });

      loadCohortData(studentsByCohort[code] || []);
    }

    function showLoadingState() {
      document.querySelector(".card-container").innerHTML = `
        <div class="col-12 text-center py-5">
          <div class="spinner-border" role="status" style="color: #31268c;">
            <span class="visually-hidden">Loading cohorts...</span>
          </div>
        </div>
      `;
    }

    async function loadCohortData(students) {
      cohortMembers = [];
      const currentEmail = localStorage.getItem('userEmail');

      cohortMembers = students.map(s => {
        let profile = {};
        if (s.profile) {
          try {
            profile = typeof s.profile === 'string' ? JSON.parse(s.profile) : s.profile;
          } catch (e) {
            console.error('Error parsing profile for', s.email, e);
          }
        }
        return {
          id: s.id,
          email: s.email,
          displayName: s.displayName,
          cohort: s.cohortId,
          profile,
          isCurrentUser: s.email === currentEmail
        };
      });

      // Ensure current user appears first
      cohortMembers.sort((a, b) => b.isCurrentUser - a.isCurrentUser);

      if (cohortMembers.length === 0) {
        showEmptyState();
        return;
      }

      loadCohortPage(1);
      renderPaginationControls();
    }

    function showEmptyState() {
      const cardContainer = document.querySelector(".card-container");
      document.querySelector(".pagination-container")?.remove();

      if (viewingAsTutor) {
        const cohort = tutorCohorts.find(c => c.code === selectedCohortCode);
        cardContainer.innerHTML = `
          <div class="col-12 text-center py-5">
            <h3 class="text-muted">No students have joined <span class="empty-cohort-name"></span> yet</h3>
          </div>
        `;
        cardContainer.querySelector('.empty-cohort-name').textContent = cohort ? cohort.name : 'this cohort';
        return;
      }

      cardContainer.innerHTML = `
        <div class="col-12 text-center py-5">
          <h3 class="text-muted mb-3">No one else has joined your cohort yet</h3>
          <p class="text-muted mb-4">In the meantime, make sure your profile is up to date so your cohort can get to know you when they arrive!</p>
          <a href="javascript:void(0);" onclick="createPath('pages/profile.html')" class="btn text-white" style="background-color: #31268c;">
            Update your profile
          </a>
        </div>
      `;
    }

    function loadCohortPage(page) {
      const cardContainer = document.querySelector(".card-container");
      cardContainer.innerHTML = "";
      currentPage = page;

      if (cohortMembers.length === 1 && cohortMembers[0].isCurrentUser) {
        cardContainer.innerHTML = `
          <div class="col-12 text-center py-4">
            <p class="text-muted">You're the first one here! Your cohort members will appear as they join.</p>
          </div>
        `;
      }

      const start = (page - 1) * itemsPerPage;
      const end = start + itemsPerPage;
      const pageMembers = cohortMembers.slice(start, end);

      pageMembers.forEach(({ id, email, displayName, profile, isCurrentUser }) => {
        const youBadge = isCurrentUser ? ' <span class="badge bg-secondary">You</span>' : '';
        const cardHTML = `
          <div class="col-lg-3 col-md-4 col-sm-6 col-12">
            <div class="card shadow m-2" style="height: fit-content">
              <div class="card-body">
                <p class="h5 text-center" style="padding-top:0;">${displayName}${youBadge}</p>
                <div class="d-flex justify-content-center">
                  <img class="rounded-circle avatar-dimensions img-thumbnail" src="../images/blank_avatar.jpg"
                    alt="Profile picture of ${displayName}" data-user-id="${id}" />
                </div>
                <div class="text-center mt-4">
                  <a href="javascript:void(0);" data-name="${displayName}" data-id="${id}" ${isCurrentUser ? 'data-self="true"' : ''} class="dynamic-link" title="View profile">${isCurrentUser ? 'Edit your profile' : 'View profile'}</a>
                </div>
              </div>
            </div>
          </div>
        `;
        cardContainer.insertAdjacentHTML('beforeend', cardHTML);
        setUserProfileImage(id);
      });

      document.querySelectorAll(".dynamic-link").forEach(link => {
        link.addEventListener("click", (e) => {
          e.preventDefault();
          const target = e.target;
          if (target.getAttribute("data-self") === "true") {
            createPath('pages/profile.html');
            return;
          }
          const name = target.getAttribute("data-name");
          const id = target.getAttribute("data-id");
          redirect(name, id);
        });
      });

      renderPaginationControls();
    }

    function renderPaginationControls() {
      const paginationContainer = document.createElement("div");
      paginationContainer.className = "pagination-container text-center mt-4";

      const totalPages = Math.ceil(cohortMembers.length / itemsPerPage);
      for (let i = 1; i <= totalPages; i++) {
        const pageButton = document.createElement("button");
        pageButton.className = "btn btn-outline-secondary mx-1";
        pageButton.textContent = i;

        if (i === currentPage) {
          pageButton.classList.add("active");
        }

        pageButton.onclick = () => {
          currentPage = i;
          loadCohortPage(i);
        };

        paginationContainer.appendChild(pageButton);
      }

      document.querySelector(".pagination-container")?.remove();
      document.querySelector(".container-fluid.page-content").appendChild(paginationContainer);
    }

    async function setUserProfileImage(userId) {
      const imgElement = document.querySelector(`img[data-user-id="${userId}"]`);
      if (!imgElement) return;

      try {
        const url = await window.profilePictures.getProfilePictureUrl(userId);
        if (url) imgElement.src = url;
      } catch (error) {
        console.error(`Error fetching profile image for ${userId}:`, error);
      }
    }


    function createPath(options) {
      window.location = getPath() + options;
    }

    function redirect(name, id) {
      if (!name || !id) {
        console.error("Redirect error: Missing name or id", { name, id });
        return;
      }

      const url = `${getPath()}pages/cohort/member.html?name=${encodeURIComponent(name)}&id=${encodeURIComponent(id)}`;
      window.location.href = url;
    }

    function logUserOut(event) {
      logout();
    }
  </script>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"></script>

</body>
